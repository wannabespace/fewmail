name: Railway

on:
  push:
    branches: [main]
    paths: ['.railway/**', '.github/workflows/railway.yml']
  workflow_dispatch:
    inputs:
      destructive:
        description: Also remove services and variables that railway.ts no longer has
        type: boolean
        default: false

# Two applies at once would race; Railway rejects the second one as stale anyway.
concurrency:
  group: railway
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      # Only the root, for `railway/iac`; the root's install scripts start the local portless proxy.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter .
      - run: bun install --global @railway/cli@latest
      - run: railway config plan
      # Removals only from a manual run with `destructive` ticked, never from a push.
      - run: railway config apply --yes ${{ inputs.destructive && '--confirm-destructive' || '' }}
