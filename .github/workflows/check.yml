name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      # The root's install scripts start the local portless proxy.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # `bun check` runs the `bun` package's binary, which its own install script fetches.
      - run: pnpm rebuild bun
      - run: pnpm run check
      - run: pnpm run check-types
      - run: pnpm run test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # CASA is renewed every year: a known high in production dependencies fails the check.
      - run: pnpm audit --prod --audit-level=high
      - name: Report all advisories
        if: always()
        run: pnpm audit || true
