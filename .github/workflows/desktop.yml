name: Desktop

# Bump `version` in apps/desktop/src-tauri/tauri.conf.json and push the tag `desktop-v<version>`: open apps update
# within four hours (Tauri's updater reads `latest.json` from this repository's latest release).
on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      # One system's failure must not cancel the others' release.
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15
            target: x86_64-apple-darwin
          - runner: windows-2025
          - runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: |
          grep -q "\"version\": \"${GITHUB_REF_NAME#desktop-v}\"" apps/desktop/src-tauri/tauri.conf.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The root's install scripts start the local portless proxy.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @fewmail/desktop...
      # Without the Developer ID (Apple keeps it until the account's move to an organization is done) the Mac build is
      # signed ad hoc, and macOS asks to allow it once in Privacy & Security; with it, the build is signed and notarized.
      - if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_DEVELOPER_ID" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/api-key.p8"
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_DEVELOPER_ID"
            echo "APPLE_CERTIFICATE=$APPLE_DEVELOPER_ID_P12"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_DEVELOPER_ID_P12_PASSWORD"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/api-key.p8"
          } >> "$GITHUB_ENV"
      # Windows has no certificate yet, so it shows its unknown-publisher prompt.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          tagName: desktop-v__VERSION__
          releaseName: Fewmail __VERSION__
          includeUpdaterJson: true
