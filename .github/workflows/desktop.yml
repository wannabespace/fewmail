name: Desktop

# Tag `desktop-v<version>` after bumping `version` in apps/desktop/Cargo.toml; open apps update within four hours.
on:
  push:
    tags: ['desktop-v*']

jobs:
  release:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - run: test "${GITHUB_REF_NAME#desktop-v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: Import the Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="$(openssl rand -hex 16)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          echo "${{ secrets.APPLE_API_KEY }}" > "$RUNNER_TEMP/api-key.p8"
      - name: Build, sign and notarize
        env:
          # Compiled in: the app only installs updates signed by this team.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: Developer ID Application
          APPLE_API_KEY_PATH: ${{ runner.temp }}/api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: ./script/bundle.sh
      - name: Publish to wannabespace/fewmail-desktop
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          gh release create "v$VERSION" --repo wannabespace/fewmail-desktop --title "Fewmail $VERSION" --notes "" \
            target/bundle/Fewmail.dmg target/bundle/Fewmail.zip target/bundle/latest.txt
