<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1: iOS zooms into any field under 16px on focus and stays zoomed in. Safari still lets people pinch. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, interactive-widget=resizes-content"
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Fewmail</title>
    <!-- The kit's --body, before any stylesheet or script: the first frame is the page's own color, never white (the desktop app shows its window as soon as this document loads). -->
    <meta name="color-scheme" content="light dark" />
    <style>
      html {
        background: #f3eee5;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #171310;
        }
      }
      html.light {
        background: #f3eee5;
      }
      html.dark {
        background: #171310;
      }
    </style>
  </head>
  <body>
    <div id="root" class="flex min-h-svh flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
