[package]
name = "fewmail-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "Fewmail"
path = "src/main.rs"

[dependencies]
futures = "0.3"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSLocale", "NSString"] }
objc2-javascript-core = "0.3"
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "json", "gzip"] }

[profile.release]
lto = "thin"
strip = true
